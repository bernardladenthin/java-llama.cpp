#
# SPDX-License-Identifier: MIT
#
# One-question probe, and the question is now narrow: at which clang version does the unpatched
# _mm_prefetch call in ggml/src/ggml-cpu/arch/x86/quants.c stop being a warning and become an error?
#
# What is already measured, locally against the real file at -msse4.2 (the sse42 CPU variant is the
# only variant that compiles that branch -- `#elif defined(__SSSE3__)`, which the x86-64 baseline
# does not reach):
#
#   clang 20.1.8  ->  4 warnings, object file produced, exit 0
#   clang 23.1.3  ->  4 errors,   no object file,       exit 1
#
# That explains upstream llama.cpp's green windows-cpu release job completely: the runner image
# carries LLVM 20.1.8 on PATH, so upstream gets warnings. No mystery is left -- but the build does
# break with a current LLVM, which is what patches/0017 fixes. The flip is somewhere in 21..23.
#
# The runner also ships clang 22.1.3 inside Visual Studio 2026, the one version neither local
# toolchain has, so this job narrows the flip by measuring it -- on the REAL file at the pinned tag,
# not on a stand-in, and both before and after the patch.
#
# It never fails: it measures. Read the job summary, then correct the patch header and the upstream
# report from it. Delete this workflow once the answer is recorded -- it guards nothing.

name: Probe MSVC _mm_prefetch declaration

on:
  # A dispatch-only workflow cannot be triggered until it sits on the default branch, so the
  # pull_request trigger is what makes this answerable on the very PR that adds it. The paths
  # filter keeps it off every other PR -- it only runs when this file itself changes.
  pull_request:
    paths:
      - '.github/workflows/probe-msvc-prefetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: _mm_prefetch declaration and plain-clang outcome
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain inventory
        continue-on-error: true
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          "VS install : $vs"
          "VS version : $(& $vswhere -latest -property catalog_productDisplayVersion)"
          ""
          "=== Installed MSVC toolsets, and how each declares _mm_prefetch ==="
          # MSVC's `char const *` is what makes a typed pointer a diagnostic at all. Measured on the
          # first run: all three toolsets (14.29 / 14.44 / 14.51) declare it identically, so the
          # toolset is NOT the variable here -- the clang version is.
          foreach ($t in Get-ChildItem "$vs\VC\Tools\MSVC" -Directory) {
            $h = Join-Path $t.FullName "include\xmmintrin.h"
            if (Test-Path $h) {
              $line = Select-String -Path $h -Pattern "void\s+_mm_prefetch" | Select-Object -First 1
              "  $($t.Name): $(if ($line) { $line.Line.Trim() } else { '(no declaration found)' })"
            }
          }
          "VSPATH=$vs" | Out-File -Append $env:GITHUB_ENV

      - name: Fetch the real ggml source at the pinned tag
        continue-on-error: true
        shell: pwsh
        run: |
          # The pin is the single source of truth, so the probe cannot drift from what we build.
          $tag = (Select-String -Path llama/CMakeLists.txt -Pattern 'GIT_TAG\s+(b\d+)' |
                  Select-Object -First 1).Matches[0].Groups[1].Value
          "pinned llama.cpp tag: $tag"
          git -c advice.detachedHead=false clone --depth 1 --branch $tag --filter=blob:none --sparse https://github.com/ggml-org/llama.cpp lc 2>&1 |
              Select-Object -Last 2
          git -C lc sparse-checkout set ggml
          "quants.c present: $(Test-Path lc/ggml/src/ggml-cpu/arch/x86/quants.c)"
          "LCTAG=$tag" | Out-File -Append $env:GITHUB_ENV

      - name: Compile the real quants.c with every clang, unpatched and patched
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          # Every clang on this runner, by path. x64 only -- VC\Tools\Llvm also holds an ARM64
          # clang, which cannot start on an x64 host (that killed the first run).
          $clangs = @(
            "$env:VSPATH\VC\Tools\Llvm\x64\bin\clang.exe",
            "${env:ProgramFiles}\LLVM\bin\clang.exe"
          ) | Where-Object { Test-Path $_ }
          $fromPath = (Get-Command clang -ErrorAction SilentlyContinue).Source
          if ($fromPath -and ($clangs -notcontains $fromPath)) { $clangs += $fromPath }
          "clang executables found:"
          $clangs | ForEach-Object { "  $_" }
          ""

          $src = "lc/ggml/src/ggml-cpu/arch/x86/quants.c"
          # -msse4.2 and nothing else: exactly what ggml's GNU-flag branch passes for the sse42
          # variant (ggml-cpu/CMakeLists.txt -- its `/arch:` branch sits behind `if (MSVC)`, which
          # is false for plain clang). NOTE the quoting: PowerShell split a bare -msse4.2 into
          # "-msse4" and ".2" on the previous run, so every argument is a quoted string.
          # Not named $args -- that is a PowerShell automatic variable.
          $cflags = @('-target','x86_64-pc-windows-msvc','-c','-O2','-msse4.2',
                      '-Ilc/ggml/include','-Ilc/ggml/src','-Ilc/ggml/src/ggml-cpu',
                      '-Ilc/ggml/src/ggml-cpu/arch/x86')

          function Measure-Clang($exe, $label) {
            Remove-Item probe.obj -ErrorAction SilentlyContinue
            $out = & $exe @cflags $src -o probe.obj 2>&1 | ForEach-Object { $_.ToString() }
            $ok  = ($LASTEXITCODE -eq 0)
            $e   = @($out | Where-Object { $_ -match ': error:' }).Count
            $w   = @($out | Where-Object { $_ -match ': warning:' }).Count
            "=== $label : $(if ($ok) { 'COMPILES' } else { 'FAILS' }) -- $e errors, $w warnings ==="
            $out | Select-Object -First 3 | ForEach-Object { "    $_" }
            ""
            [pscustomobject]@{ Label = $label; Ok = $ok; Errors = $e; Warnings = $w }
          }

          function Clang-Version($exe) {
            ((& $exe --version | Select-Object -First 1) -replace '.*version ([0-9.]+).*', '$1').Trim()
          }

          $rows = @()
          foreach ($c in $clangs) { $rows += (Measure-Clang $c "clang $(Clang-Version $c) unpatched") }

          # Now apply our patch to the real tree and measure the same compilers again.
          "--- applying patches/0017 to the real tree ---"
          git -C lc apply --verbose ../llama/patches/0017-ggml-cpu-x86-prefetch-byte-offset-and-msvc-type.patch 2>&1 |
              Select-Object -Last 3
          "prefetch.h present: $(Test-Path lc/ggml/src/ggml-cpu/arch/x86/prefetch.h)"
          ""
          foreach ($c in $clangs) { $rows += (Measure-Clang $c "clang $(Clang-Version $c) patched") }

          $table = @("### _mm_prefetch probe -- real quants.c, llama.cpp $env:LCTAG, ``-msse4.2``",
                     "",
                     "| compiler / state | result | errors | warnings |",
                     "|---|---|--:|--:|")
          foreach ($r in $rows) {
            $verdict = if ($r.Ok) { 'compiles' } else { '**fails**' }
            $table += "| $($r.Label) | $verdict | $($r.Errors) | $($r.Warnings) |"
          }
          $table += ""
          $table += "A row that compiles *with warnings* is why upstream's ``windows-cpu`` job is green. A row that fails is what ``patches/0017`` fixes. Every patched row must compile with 0 errors and 0 warnings."
          $table | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $table | ForEach-Object { $_ }
