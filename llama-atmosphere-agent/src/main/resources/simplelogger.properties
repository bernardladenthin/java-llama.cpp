# Console agent defaults: keep the framework quiet so the streamed answer is what the user sees.
# Override per run with -Dorg.slf4j.simpleLogger.defaultLogLevel=debug (shows every request).
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
