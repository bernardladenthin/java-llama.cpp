version = 1

# Markdown files (cannot have inline SPDX headers)
[[annotations]]
path = [
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "SUPPORT.md",
    "CLAUDE.md",
    "llama-atmosphere-agent/CLAUDE.md",
    "android-llmservice/CLAUDE.md",
    "CLAUDE_TEST_GENERATION_PROMPT.md",
    "docs/RELEASE.md",
    "docs/feature-investigation-llama-stack-client-kotlin.md",
    "docs/history/49be664_24918e4.md",
    "docs/history/49be664_open_issues.md",
    "docs/history/49be664_open_issues_comments.md",
    "docs/history/CHAT_INTEGRATION_SUMMARY.md",
    "docs/history/REFACTORING.md",
    "llama/src/test/resources/images/README.md",
    "llama/src/test/resources/audios/README.md",
    ".claude/commands/find-cpp-duplication.md",
    "llama-langchain4j/README.md",
    "models/README.md",
]
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT"

# The README still carries text of the upstream project (kherud/java-llama.cpp)
[[annotations]]
path = "README.md"
SPDX-FileCopyrightText = [
    "2023-2025 Konstantin Herud",
    "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>",
]
SPDX-License-Identifier = "MIT"

# CITATION.cff (not recognized by reuse annotate)
[[annotations]]
path = "CITATION.cff"
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT"

# CMakeLists.txt (CMake format not recognized by reuse annotate)
[[annotations]]
path = "llama/CMakeLists.txt"
SPDX-FileCopyrightText = [
    "2023-2025 Konstantin Herud",
    "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>",
]
SPDX-License-Identifier = "MIT"

# The dockcross wrappers are generated, unmodified output of dockcross's own wrapper template
# (imagefiles/dockcross.sh), printed by `docker run --rm dockcross/<image>:<tag>`; copyright and
# license as in https://github.com/dockcross/dockcross/blob/master/LICENSE.
[[annotations]]
path = [
    ".github/dockcross/dockcross-android-arm64",
    ".github/dockcross/dockcross-android-x86_64",
    ".github/dockcross/dockcross-manylinux2014-x64",
    ".github/dockcross/dockcross-manylinux_2_28-x64",
]
SPDX-FileCopyrightText = "2015-2021 Steeve Morin, Rob Burns, Matthew McCormick, Jean-Christophe Fillion-Robin, Bensuperpc"
SPDX-License-Identifier = "MIT"

# GITHUB/ISSUE_TEMPLATE/config.yml handled by reuse annotate below

# llama.cpp source patches (unified-diff format cannot carry inline SPDX without corrupting the
# diff). Glob covers every current and future patch dropped into patches/ — see CLAUDE.md
# "Local llama.cpp source patches".
[[annotations]]
path = "llama/patches/**"
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT"

# Project logo / branding assets (binary + generated SVG, cannot carry inline SPDX
# without corrupting the base64-embedded font). Same MIT OR Apache-2.0 dual license
# the author ships them under in the workspace repo (the embedded Martian Mono font
# is OFL-1.1; only the standalone .ttf — not shipped here — carries that identifier).
[[annotations]]
path = [
    "docs/branding/java-llama-cpp.svg",
    "docs/branding/java-llama-cpp.png",
]
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Android launcher-icon PNGs (binary, cannot carry inline SPDX). Generated from the
# shard-J of the java-llama.cpp logo; same MIT OR Apache-2.0 as the branding assets
# above (the adaptive-icon + colour XMLs carry their SPDX headers inline).
[[annotations]]
path = "android-llmservice/app/src/main/res/mipmap-*/ic_launcher*.png"
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# LLM Service Play-Store hi-res icon (binary PNG, cannot carry inline SPDX). Store
# asset only — not bundled into the APK. Generated from the shard-J of the logo;
# MIT OR Apache-2.0 like the rest of the shared logo set.
[[annotations]]
path = "android-llmservice/store/ic_launcher-512.png"
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Test image (binary, cannot carry inline SPDX)
[[annotations]]
path = "llama/src/test/resources/images/test-image.jpg"
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT"

# Test audio clip recorded by the project author; granted under MIT for this
# project (see llama/src/test/resources/audios/README.md).
[[annotations]]
path = "llama/src/test/resources/audios/sample.wav"
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT"

# Backend loader test fixtures (backendtest/ + backendtest-ok/):
# deliberately unloadable fake *.so placeholders (one-line text files) plus two
# trivial real x86-64 ELF dummies in backendtest-ok/ (built from a one-line C
# TU, no upstream code) — .so files have no inline-comment syntax for SPDX
# headers; the jllama-extras.txt files carry theirs inline. Consumed by
# BackendLoadTest.
[[annotations]]
path = "llama/src/test/resources/net/ladenthin/llama/Linux/backendtest*/**"
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT"

# JNI header files from Oracle (GPL-2.0-only WITH Classpath-exception-2.0)
[[annotations]]
path = [
    ".github/include/unix/jni.h",
    ".github/include/unix/jni_md.h",
    ".github/include/windows/jni.h",
    ".github/include/windows/jni_md.h",
]
SPDX-FileCopyrightText = "1996-2023 Oracle and/or its affiliates"
SPDX-License-Identifier = "GPL-2.0-only WITH Classpath-exception-2.0"

# The issue/PR templates are kept byte-identical in java-llama.cpp, BitcoinAddressFinder, srcmorph
# and streambuffer (.github/shared-files.sha256) and carry the license of the other shared files.
# Last in this file on purpose: of several matching annotations the last one applies.
[[annotations]]
path = [
    ".github/ISSUE_TEMPLATE/bug_report.md",
    ".github/ISSUE_TEMPLATE/feature_request.md",
    ".github/PULL_REQUEST_TEMPLATE.md",
]
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT OR Apache-2.0"
